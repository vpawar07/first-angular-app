<app-header/>
<main>
  <ul id="users">
    @for(user of users; track user.id){
      <li>
        <app-user [selected]="user.id === selectedUserId" [user] = "user" (select)="onSelectUser($event)"/>
      </li>
    }
  </ul>
  @if(selectedUser){
    <app-tasks [userId] = "selectedUser.id" [userName] = "selectedUser.name"/>
  } @else {
    <p is="fallback">Select user to see the there task!</p>
  }
</main>
