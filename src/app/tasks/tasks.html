@if(isAddingNewTask){
    <app-new-task/>
}

<section id="tasks">
    <header>
        <h3>{{ userName }}'s Tasks</h3>
        <menu>
            <button (click)="onAddNewTask()">Add Task</button>
        </menu>
    </header>

    <ul>
        @for(task of selectedUserTasks; track task.id){
            <li>
                <app-task [task]="task" (complete)="onCompleteTask($event)"/>
            </li>
        }
    </ul>
</section>
